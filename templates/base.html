<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Monika Kosiarska — Narrative Design{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="container nav">
            <a class="logo" href="{{ url_for('index') }}">MONIKA<span>.</span>KOSIARSKA</a>

            <button class="menu-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
            </button>

            <div class="nav-links">
                <a href="{{ url_for('index') }}#work">Work</a>
                <a href="{{ url_for('index') }}#about">About</a>
                <a href="{{ url_for('index') }}#contact">Contact</a>
            </div>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
    <div class="container footer-inner">
        <p>© 2026 Monika Kosiarska — Narrative Design & Storytelling</p>
    </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
